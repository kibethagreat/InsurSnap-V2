<!DOCTYPE html>
<html lang="en" data-theme="black">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}InsurSnap{% endblock %}</title>

<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css">

<style>
  :root {
    --void: #060912;
    --surface: #0d1526;
    --surface-2: #101b30;
    --border-subtle: rgba(148, 163, 184, .14);
    --text-hi: #f4f6fb;
    --text-mid: #a6b0c3;
    --text-low: #5b6579;
    --gold: #f2b90c;
    --gold-hover: #ffd23f;
    --success: #34d399;
    --success-bg: rgba(52, 211, 153, .12);
    --warning: #fbbf24;
    --warning-bg: rgba(251, 191, 36, .12);
    --danger: #f87171;
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--void);
    color: var(--text-hi);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100%;
  }

  body {
    background-image:
      radial-gradient(circle at 1px 1px, rgba(148,163,184,.16) 1px, transparent 0);
    background-size: 28px 28px;
  }

  .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; }
  .font-mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  /* --- Nav --- */
  .sentinel-nav {
    position: sticky; top: 0; z-index: 40;
    background: rgba(6, 9, 18, .72);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-subtle);
  }
  .sentinel-nav a.nav-link {
    color: var(--text-mid);
    font-size: .875rem;
    transition: color .15s ease;
  }
  .sentinel-nav a.nav-link:hover { color: var(--text-hi); }

  .brand-shield { color: var(--void); }
  .brand-word-sentinel { color: var(--text-hi); font-weight: 700; letter-spacing: .02em; }
  .brand-word-claims { color: var(--gold); font-weight: 700; letter-spacing: .02em; }

  /* --- Buttons --- */
  .btn-gold {
    background: var(--gold);
    color: #1a1200;
    border: none;
    font-weight: 600;
    transition: background .15s ease, transform .1s ease;
  }
  .btn-gold:hover { background: var(--gold-hover); }
  .btn-gold:active { transform: translateY(1px); }

  .btn-ghost-outline {
    background: transparent;
    color: var(--text-hi);
    border: 1px solid var(--border-subtle);
    transition: border-color .15s ease, background .15s ease;
  }
  .btn-ghost-outline:hover { border-color: rgba(148,163,184,.4); background: rgba(255,255,255,.03); }

  .btn-pill-outline {
    background: transparent;
    color: var(--text-hi);
    border: 1px solid var(--border-subtle);
    border-radius: 999px;
  }
  .btn-pill-outline:hover { border-color: rgba(148,163,184,.4); background: rgba(255,255,255,.03); }

  /* --- Glass card --- */
  .glass-card {
    background: rgba(13, 21, 38, .72);
    border: 1px solid var(--border-subtle);
    border-radius: 1rem;
    backdrop-filter: blur(8px);
  }
  .inset-panel {
    background: var(--surface-2);
    border: 1px solid var(--border-subtle);
    border-radius: .75rem;
  }

  /* --- Badges --- */
  .badge-eyebrow {
    display: inline-flex; align-items: center; gap: .4rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .7rem; letter-spacing: .08em;
    color: var(--text-mid);
    background: rgba(255,255,255,.03);
    border: 1px solid var(--border-subtle);
    border-radius: 999px;
    padding: .3rem .75rem;
  }
  .badge-approved {
    color: var(--success);
    background: var(--success-bg);
    border: 1px solid rgba(52,211,153,.3);
  }
  .badge-review {
    color: var(--warning);
    background: var(--warning-bg);
    border: 1px solid rgba(251,191,36,.3);
  }
  .status-dot {
    width: .45rem; height: .45rem; border-radius: 999px;
    display: inline-block;
  }
  .status-dot.live { background: var(--success); box-shadow: 0 0 0 3px var(--success-bg); }

  /* --- Force field canvas --- */
  .force-field-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    display: block;
  }

  /* --- Form controls --- */
  .field-input, .field-select {
    background: rgba(255,255,255,.03);
    border: 1px solid var(--border-subtle);
    color: var(--text-hi);
    border-radius: .6rem;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field-input::placeholder { color: var(--text-low); }
  .field-input:focus, .field-select:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(242,185,12,.15);
  }
  .field-label {
    font-size: .8rem; font-weight: 600; color: var(--text-mid);
    letter-spacing: .01em;
  }
  .field-error {
    color: var(--danger); font-size: .8rem; margin-top: .25rem;
  }
  .flash-error {
    background: rgba(248,113,113,.1);
    border: 1px solid rgba(248,113,113,.3);
    color: #fecaca;
    border-radius: .6rem;
    padding: .7rem .9rem;
    font-size: .875rem;
  }
  
   /* --- Rendered markdown (How it Works / README) --- */
  .readme-prose { color: var(--text-mid); overflow-wrap: break-word; word-break: break-word; }
  .readme-prose h1, .readme-prose h2, .readme-prose h3, .readme-prose h4 {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    color: var(--text-hi);
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .readme-prose h1 { font-size: 1.9rem; margin: 0 0 .5rem; }
  .readme-prose h2 {
    font-size: 1.3rem; margin: 2.25rem 0 .9rem;
    padding-top: 1.5rem; border-top: 1px solid var(--border-subtle);
  }
  .readme-prose h2:first-of-type { border-top: none; padding-top: 0; margin-top: 1.25rem; }
  .readme-prose h3 { font-size: 1.05rem; margin: 1.5rem 0 .6rem; color: var(--gold); }
  .readme-prose p, .readme-prose li { line-height: 1.7; font-size: .925rem; }
  .readme-prose p { margin: .75rem 0; }
  .readme-prose ul, .readme-prose ol { margin: .75rem 0 1rem; padding-left: 1.35rem; }
  .readme-prose ul { list-style: disc; }
  .readme-prose ol { list-style: decimal; }
  .readme-prose li { margin: .3rem 0; }
  .readme-prose li::marker { color: var(--gold); }
  .readme-prose strong { color: var(--text-hi); font-weight: 600; }
  .readme-prose a { color: var(--gold); text-decoration: underline; text-underline-offset: 2px; }
  .readme-prose a:hover { color: var(--gold-hover); }
  .readme-prose code {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border-subtle);
    border-radius: .3rem;
    padding: .1rem .4rem;
    font-size: .82em;
    color: var(--text-hi);
  }
  .readme-prose pre {
    background: var(--surface-2);
    border: 1px solid var(--border-subtle);
    border-radius: .6rem;
    padding: 1rem 1.1rem;
    overflow-x: auto;
    margin: 1rem 0;
  }
  .readme-prose pre code {
    background: none; border: none; padding: 0; font-size: .82rem;
    color: var(--text-mid); line-height: 1.6;
  }
  .readme-prose table {
    width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: .85rem;
  }
  .readme-prose th, .readme-prose td {
    border: 1px solid var(--border-subtle); padding: .5rem .75rem; text-align: left;
  }
  .readme-prose th {
    background: rgba(255,255,255,.03); color: var(--text-hi); font-weight: 600;
    font-family: 'IBM Plex Mono', monospace; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em;
  }
  .readme-prose hr { border: none; border-top: 1px solid var(--border-subtle); margin: 2rem 0; }
  .readme-prose blockquote {
    border-left: 3px solid var(--gold);
    padding-left: 1rem; margin: 1rem 0; color: var(--text-mid); font-style: italic;
  }


  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
{% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col">

<nav class="sentinel-nav">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="{% url 'landing' %}" class="flex items-center gap-2.5">
      <span class="brand-shield inline-flex items-center justify-center w-8 h-8 rounded-md" style="background: var(--gold);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z" fill="currentColor"/>
          <path d="M9 12.5l2 2 4-4.5" stroke="#060912" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </span>
      <span class="font-display text-lg leading-none">
        <span class="brand-word-sentinel">InsurSnap</span><span class="brand-word-claims">CLAIMS</span>
      </span>
    </a>

    <div class="hidden md:flex items-center gap-8">
      <a href="{% url 'landing' %}#coverage" class="nav-link">Our Coverage</a>
      <a href="{% url 'how_it_works' %}" class="nav-link">How it Works</a>
      <a href="{% url 'landing' %}#support" class="nav-link">Support</a>
    </div>

    <a href="{% url 'landing' %}#support" class="btn btn-sm btn-pill-outline font-medium">Agent Portal</a>
  </div>
</nav>

<main class="flex-1">
  {% block content %}{% endblock %}
</main>

<footer class="border-t" style="border-color: var(--border-subtle);">
  <div class="max-w-6xl mx-auto px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-3 font-mono text-xs" style="color: var(--text-low);">
    <span>DECISION ENGINE &middot; INSURSNAP-v4.2.0</span>
    <span class="flex items-center gap-2"><span class="status-dot live"></span>SYSTEMS NOMINAL</span>
  </div>
</footer>

</body>
</html>
